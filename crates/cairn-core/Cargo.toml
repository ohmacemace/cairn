[package]
name = "cairn-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cloud session management for AI coding agents"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
flate2 = "1"
walkdir = "2"
dirs = "6"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
