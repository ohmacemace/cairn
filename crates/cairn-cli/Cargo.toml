[package]
name = "cairn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cairn command line interface"

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
cairn-core = { path = "../cairn-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
